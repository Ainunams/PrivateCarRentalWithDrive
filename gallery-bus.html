<!-- ส่วนหัวของหน้าแกลเลอรี -->
    <section class="page-header">
      <div class="container">
        <h1>แกลเลอรีรูปภาพ Bus</h1>
        <p>บรรยากาศภายในของรถ Bus พร้อมให้บริการ</p>
      </div>
    </section>

<!-- ส่วนแสดงกรอบรูปภาพ 3 รูป -->
    <section style="padding: 60px 0;">
      <div class="container">
        <div class="gallery-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px;">
          
          <!-- กรอบรูปที่ 1 -->
          <div class="gallery-card" style="background: var(--white); border-radius: 16px; overflow: hidden; border: 1px solid rgba(15, 36, 56, 0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.04);">
            <div style="height: 250px; background: #f4f4f4; overflow: hidden;">
              <img src="bus1.png" alt="Toyota Altis มุมที่ 1" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div style="padding: 20px; text-align: center;">
              <h3 style="font-size: 1.1rem; color: var(--navy);">มุมมองภายในด้านหน้า</h3>
            </div>
          </div>

<!-- กรอบรูปที่ 2: เบาะนั่งภายในกว้างขวาง (สามารถเลื่อนดูได้หลายรูปในกรอบเดียว) -->
          <div class="gallery-card" style="background: var(--white); border-radius: 16px; overflow: hidden; border: 1px solid rgba(15, 36, 56, 0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.04);">
            <div style="height: 250px; background: #f4f4f4; position: relative;">
              <div class="image-slider-container">
                <!-- รูปที่ 1 ของเบาะนั่ง -->
                <div class="slider-item">
                  <img src="bus2.png" alt="เบาะนั่งภายในกว้างขวาง รูปที่ 1">
                </div>
                <!-- รูปที่ 2 ของเบาะนั่ง (สามารถเพิ่มรูปที่ 3, 4 ต่อตรงนี้ได้เลย) -->
                <div class="slider-item">
                  <img src="bus2.1.png" alt="เบาะนั่งภายในกว้างขวาง รูปที่ 2">
                </div>
              </div>
            </div>
            <div style="padding: 20px; text-align: center;">
              <h3 style="font-size: 1.1rem; color: var(--navy);">เบาะนั่งภายในกว้างขวาง</h3>
              <p class="scroll-hint">💡 (ปัดซ้าย-ขวาเพื่อดูรูปเพิ่มเติม)</p>
            </div>
          </div>

          <!-- กรอบรูปที่ 3 -->
          <div class="gallery-card" style="background: var(--white); border-radius: 16px; overflow: hidden; border: 1px solid rgba(15, 36, 56, 0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.04);">
            <div style="height: 250px; background: #f4f4f4; overflow: hidden;">
              <img src="bus3.png" alt="Toyota Altis มุมที่ 3" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div style="padding: 20px; text-align: center;">
              <h3 style="font-size: 1.1rem; color: var(--navy);">พื้นที่เก็บสัมภาระด้านหลัง</h3>
            </div>
          </div>

        </div>

        <!-- ปุ่มย้อนกลับไปหน้าประเภทรถ -->
        <div style="text-align: center; margin-top: 50px;">
          <a href="vehicles.html" class="btn-secondary" style="padding: 12px 30px; border-radius: 999px; border: 1px solid var(--navy); color: var(--navy); display: inline-block;">← กลับสู่หน้าประเภทรถ</a>
        </div>
      </div>
    </section>
<!-- ใส่โค้ดนี้ไว้ก่อนปิดแท็ก body ในทุกๆ หน้า -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const hamburger = document.querySelector('.hamburger-menu');
        const navLinks = document.querySelector('.nav-links');

        if (hamburger && navLinks) {
          hamburger.addEventListener('click', function() {
            // สั่งเปิด-ปิดคลาส active เพื่อแสดง/ซ่อนเมนู
            navLinks.classList.toggle('active');
          });
        }
      });
    </script>
  </body>
</html>
